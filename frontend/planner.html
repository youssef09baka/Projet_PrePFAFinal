<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Smart Travel Planner — Planifier</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Styles personnalisés -->
  <link rel="stylesheet" href="assets/css/main.css">
</head>

<body>

  <!-- ===============================
       NAVBAR PRINCIPALE
  ================================ -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">

      <a class="navbar-brand fw-bold" href="index.html">
        Smart Travel Planner
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#nav"
        aria-controls="nav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Accueil</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="planner.html">Planifier</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about.html">À propos</a>
          </li>
        </ul>
      </div>

    </div>
  </nav>

  <!-- ===============================
       HERO PLANNER
  ================================ -->
  <section class="planner-hero" id="plannerHero">

    <div class="planner-overlay"></div>

    <!-- Espace pour compenser la navbar fixed -->
    <div style="height: 80px;"></div>

    <!-- ===============================
         CONTENU PRINCIPAL
    ================================ -->
    <div class="container py-5 position-relative">
      <div class="row justify-content-center">
        <div class="col-lg-8">

          <h2 class="fw-bold text-center mb-4 text-white">
            📍 Planifiez votre voyage
          </h2>

          <!-- ===============================
               FORMULAIRE DE PLANIFICATION
          ================================ -->
          <form id="plannerForm" class="card shadow-lg p-4 fade-slide">

            <div class="mb-3">
              <label class="form-label">Ville de départ</label>
              <input
                type="text"
                class="form-control"
                id="from"
                placeholder="Ex : Casablanca"
                required
              >
            </div>

            <div class="mb-3">
              <label class="form-label">Destination</label>
              <input
                type="text"
                class="form-control"
                id="to"
                placeholder="Ex : Tanger"
                required
              >
            </div>

            <div class="mb-3">
              <label class="form-label">Date de départ</label>
              <input
                type="date"
                class="form-control"
                id="startDate"
                required
              >
            </div>

            <div class="mb-3">
              <label class="form-label">Date de retour</label>
              <input
                type="date"
                class="form-control"
                id="endDate"
                required
              >
            </div>

            <div class="mb-3">
              <label class="form-label">Budget (DH)</label>
              <input
                type="number"
                class="form-control"
                id="budget"
                placeholder="Ex : 800"
                required
              >
            </div>

            <button type="submit" class="btn btn-primary w-100">
              🔍 Lancer l’analyse
            </button>

          </form>

          <!-- ===============================
               ZONE D’AFFICHAGE DES RÉSULTATS
          ================================ -->
          <div id="result" class="mt-5"></div>

        </div>
      </div>
    </div>

  </section>

  <!-- ===============================
       FOOTER
  ================================ -->
  <footer class="footer text-center py-3">
    © 2026 Smart Travel Planner — Projet académique
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS global -->
  <script src="assets/js/app.js"></script>

  <!-- JS spécifique au planner -->
  <script src="assets/js/planner.js"></script>

</body>
</html>
